# fly.toml app configuration file generated for contextmesh on 2026-05-31T16:01:38Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'contextmesh'
primary_region = 'sin'

[build]

[env]
  CONTEXTMESH_ENV = 'production'
  PORT = '8080'
  WORKERS = '2'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
